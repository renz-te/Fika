name: Deploy to InfinityFree
on:
  push:
    branches:
      - main
jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Sync Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/*
            !app/**
            !fika_hrms/**
            !fika_pos/**
            !fika_finance/**
            !fika_inventory/**
            !public/**
            !index.php
            !login.php
            !careers.php
            !applicant_form.php
            !config/permissions.php
            !config/paymongo.php
            !uploads/.htaccess
            !uploads/menu/.htaccess
            !storage/.htaccess
            !.htaccess
            !**/.htaccess
            config/config.php
            config/config.example.php
            **/.env*
            .env*
            tests/**
            **/tests/**
            tools/**
            **/tools/**
            migrations/**
            **/migrations/**
            docs/**
            **/docs/**
            **/*.md
            *.md
            **/*.sql
            *.sql
            **/*.txt
            *.txt
            **/*_fix.php
            *_fix.php
            **/*_report.md
            *_report.md
            **/temp_*
            temp_*
            cafe_hrms/**
            cafe_pos/**
